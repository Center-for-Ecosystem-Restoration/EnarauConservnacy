[project]
name = "enarauconservnacy"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "eetools[notebook]",
    "geopandas>=1.1.4",
    "joblib>=1.5.3",
    "mapclassify>=2.10.0",
    "matplotlib>=3.11.0",
    "pandas>=3.0.3",
    "python-dotenv>=1.0.0",
    "rasterio>=1.5.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "seaborn>=0.13.0",
]

[tool.uv.sources]
eetools = { git = "https://github.com/harrellgis/gee_utils.git", tag = "v0.2.0" }

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["config.py"]
